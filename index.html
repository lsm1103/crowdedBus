<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#10233a" />
    <!-- 安卓微信 X5 内核：请求横屏 + 全屏（iOS 微信不支持，由 CSS 强制旋转兜底） -->
    <meta name="x5-orientation" content="landscape" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="x5-page-mode" content="app" />
    <meta name="screen-orientation" content="landscape" />
    <meta name="full-screen" content="yes" />
    <title>好挤的大巴</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --c-bg:#12253C; --c-mint:#4ECEB6; --c-coral:#FF7A6B; --c-lemon:#FFD23F; --c-text:#f7fbff;
        --sa-top:0px; --sa-right:0px; --sa-bottom:0px; --sa-left:0px;
        /* 舞台的 1% 宽高。orientation.ts 会按舞台实际尺寸覆盖，
           强制横屏时它和 vw/vh 正好是反的，布局必须用这一对。 */
        --sw:1vw; --sh:1vh;
        /*
         * 触控件（摇杆、动作键）的比例单位 = 1px × 倍率，用法 calc(68 * var(--u))。
         * 按舞台高度 H 线性放大：倍率 = 1 + 0.4·(H−430)/338，下限 1、上限 1.6。
         * 手机横屏（H 360~430）恒为 1px，和旧的固定像素逐像素一致；
         * 1024×768 平板 ≈1.4px；以前尺寸被 clamp 的像素上限卡死，平板上按钮显得很小。
         */
        --u:clamp(1px, calc(var(--sh) * 0.11834 + 0.49112px), 1.6px);
        /*
         * 放大后动作键额外拉开的间距：上面的"冲"上移、左边的"抓"左移。
         * 偏移是按手机上的按钮尺寸调的，整组等比放大后间距会变得相对更挤，这一项补回来。
         * 手机上 --u 恰为 1px，这一项为 0，不影响逐像素一致。
         */
        --spread:clamp(0px, calc((var(--u) - 1px) * 1000), 12px);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #05101f; overflow: hidden; position: fixed;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none; overscroll-behavior: none;
      }

      /* 读取真实安全区的探针；orientation.ts 会把它按旋转量重映射成 --sa-*。 */
      #safe-area-probe {
        position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      /*
       * 舞台。竖屏时由 orientation.ts 设成 rotate(90deg) 并互换宽高，
       * 这样在 iOS 微信这种永远不会横过来的 WebView 里也能横屏游玩。
       */
      #stage {
        position: fixed; left: 0; top: 0; width: 100%; height: 100%;
        transform-origin: 50% 50%; overflow: hidden; background: var(--c-bg);
      }
      #app { position: absolute; inset: 0; }
      canvas { display: block; }

      /*
       * 竖向尺寸全部跟舞台高度走（--sh）：667×375 这种矮屏上旧的固定 12px 间距 +
       * 78px 卡片会让大厅内容比屏幕高，居中后"开始上车"离底边不到 8px。
       * safe center：真放不下时从顶部排、底部可滚动，而不是两头一起裁掉。
       */
      .screen {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; justify-content: safe center;
        gap: clamp(6px, calc(var(--sh) * 2.4), 12px);
        overflow-y: auto; -webkit-overflow-scrolling: touch;
        padding: calc(var(--sa-top) + clamp(8px, calc(var(--sh) * 2.6), 14px)) calc(var(--sa-right) + 18px)
                 calc(var(--sa-bottom) + clamp(8px, calc(var(--sh) * 2.6), 14px)) calc(var(--sa-left) + 18px);
        background: radial-gradient(900px 520px at 50% -10%, rgba(255,196,120,.30) 0%, transparent 58%), linear-gradient(145deg,#10334e,#10223c 65%,#0c1930);
        color: var(--c-text); z-index: 30; text-align: center;
      }
      .screen.hidden { display: none; }
      h1 { margin: 0; font-size: clamp(22px, calc(var(--sh) * 5.2), 40px); letter-spacing: 2px; }
      h1 .accent { color: var(--c-coral); }
      .sub { margin: 0; font-size: clamp(11px, calc(var(--sh) * 1.9), 15px); color: #a8c3e8; }
      .hint { margin: 0; font-size: clamp(10.5px, calc(var(--sh) * 1.5), 12px); color: #7e9cc4; letter-spacing:.3px; }
      .panel {
        background:linear-gradient(145deg,rgba(17,53,77,.86),rgba(8,25,46,.84)); border:1px solid rgba(185,238,247,.25);
        box-shadow:0 18px 48px rgba(2,10,24,.32), inset 0 1px rgba(255,255,255,.12); border-radius:18px;
        padding:clamp(8px, calc(var(--sh) * 2.4), 12px);
        max-width:660px; width:100%; display:flex; flex-direction:column; gap:clamp(6px, calc(var(--sh) * 2), 10px);
      }
      .btn {
        appearance: none; border: none; border-radius: 14px; padding: clamp(8px,calc(var(--sh) * 1.8),15px) 26px;
        font-size: clamp(15px,calc(var(--sh) * 2.6),20px); font-weight: 700; color: #0b1220; cursor: pointer;
        background: linear-gradient(180deg, #ffe27a, #ffd23f); letter-spacing: 1px; flex: none;
      }
      .btn:active { transform: scale(0.97); }
      .roster { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
      .char-card {
        position:relative; overflow:hidden; min-width:0; height:clamp(60px,calc(var(--sh) * 16),142px);
        background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.17);
        border-radius:12px; cursor:pointer; transition:transform .14s,border-color .14s,box-shadow .14s;
      }
      .char-card.selected { border-color:var(--c-lemon); box-shadow:0 0 0 2px rgba(255,211,78,.25),0 8px 20px rgba(0,0,0,.26); }
      .portrait { position:absolute; inset:0; background-image:linear-gradient(0deg,rgba(8,20,36,.95) 0%,rgba(8,20,36,.18) 48%,transparent 78%),var(--portrait); background-size:cover; background-position:center 28%; }
      .portrait::after { content:""; position:absolute; inset:0; background:linear-gradient(135deg,var(--accent),transparent 45%); mix-blend-mode:soft-light; opacity:.45; }
      .char-copy { position:absolute; bottom:0; left:0; right:0; padding:5px 7px; text-align:left; }
      .char-card .name { font-weight:900; font-size:clamp(10px,calc(var(--sh) * 1.7),13px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      /* 角色只是外观：一句话说清楚，免得玩家以为选错角色会吃亏。 */
      .roster-note { margin:0; font-size:clamp(10.5px,calc(var(--sh) * 1.7),13px); color:#cfe3f5; }
      .roster-note b { color:var(--c-lemon); }

      .selected-mark { position:absolute; top:5px; right:5px; width:20px; height:20px; border-radius:50%; display:none; align-items:center; justify-content:center; background:var(--c-lemon); color:#26364a; font-weight:900; font-size:12px; }
      .char-card.selected .selected-mark { display:flex; }

      /*
       * 整场结算：标题直接写冠军是谁；名次两列排（横屏宽、矮，8 行单列在 667×375 上放不下），
       * 真放不下时名次列表自己滚，按钮永远看得见。
       */
      #result { gap: clamp(6px, calc(var(--sh) * 2.2), 12px); }
      #result h1 { display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
      #result-records {
        display:none; color:#3a2a06; background:linear-gradient(180deg,#ffe27a,#ffd23f);
        font-size:clamp(10px,calc(var(--sh) * 1.9),13px); font-weight:900;
        padding:4px 14px; border-radius:999px; white-space:nowrap; flex:none;
      }
      #result-records.show { display:block; }
      .result-actions { display:flex; gap:10px; align-items:center; flex:none; }
      .btn.secondary { background:linear-gradient(180deg,#8FD3C4,#4ECEB6); }

      /*
       * 战绩图浮层。它在 #stage 外面、不跟舞台旋转，所以安全区直接用 env()，
       * 尺寸用 vw/vh（此处 vw/vh 就是真实视口）。
       * 横屏视口：图和右侧的说明/按钮并排，否则关闭按钮会被挤出屏幕；
       * 竖屏视口（强制横屏的 iOS 微信就是这种）：上下排，图是竖版的，转回竖屏正好看。
       */
      #share-overlay {
        position:fixed; inset:0; z-index:80; display:none;
        flex-direction:row; align-items:center; justify-content:center; gap:22px;
        background:rgba(4,10,20,.94);
        padding:max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
                max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      }
      #share-overlay.show { display:flex; }
      #share-overlay .side {
        display:flex; flex-direction:column; align-items:center; gap:12px; max-width:36vw;
      }
      #share-img {
        max-width:min(46vw, 52vh); max-height:92vh; border-radius:14px;
        box-shadow:0 12px 40px rgba(0,0,0,.5);
        /* body 上写了 user-select:none / -webkit-touch-callout:none，
           那会直接让微信里的"长按保存"菜单失效，这里必须单独覆盖回来。 */
        -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto;
        pointer-events: auto;
      }
      .share-tip { color:#cfe3f5; font-size:13px; text-align:center; line-height:1.6; }
      @media (orientation: portrait) {
        #share-overlay { flex-direction:column; gap:14px; }
        #share-img { max-width:84vw; max-height:70vh; }
        #share-overlay .side { flex-direction:row; max-width:90vw; gap:16px; }
      }

      /* 名次列表只许竖向滚；position:relative 让行的 offsetTop 以列表为准，
         screens.ts 据此把玩家那一行滚进视野。两列、按行排：1 2 / 3 4 / …… */
      #result-list {
        display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-content:start; gap:3px 10px;
        flex: 0 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
        position: relative;
      }
      /*
       * 深色界面配细滚动条（系统默认是白底粗条）。
       * Chrome 121+ 只要写了 scrollbar-width/scrollbar-color 就会忽略 ::-webkit-scrollbar，
       * 所以标准属性只给不认 ::-webkit-scrollbar 的内核（Firefox）；
       * Chrome / Safari / 微信 X5 走 ::-webkit-scrollbar，能做成圆角细条并避开面板圆角。
       */
      #result-list::-webkit-scrollbar { width:6px; height:6px; }
      #result-list::-webkit-scrollbar-track { background:transparent; margin:12px 0; }
      #result-list::-webkit-scrollbar-thumb { background:rgba(185,238,247,.28); border-radius:999px; }
      #result-list::-webkit-scrollbar-thumb:active { background:rgba(185,238,247,.45); }
      @supports not selector(::-webkit-scrollbar) {
        #result-list { scrollbar-width:thin; scrollbar-color:rgba(185,238,247,.3) transparent; }
      }
      /* 行内放不下时名字省略号收尾，战绩（赢几回合 · 扔下几人）永远完整。 */
      .result-row { display:flex; align-items:center; gap:7px; padding:4px 6px; border-radius:9px; min-width:0; }
      .result-row.me { background:rgba(255,211,78,.16); }
      .result-row.champ { background:linear-gradient(90deg,rgba(255,211,63,.30),rgba(255,211,63,.06)); box-shadow:inset 0 0 0 1px rgba(255,211,63,.65); }
      .result-row .rk {
        flex:none; min-width:16px; text-align:center; font-weight:900; color:#9fb8dd;
        font-size:clamp(11px,calc(var(--sh) * 1.9),14px); font-variant-numeric:tabular-nums;
      }
      .result-row.champ .rk { color:var(--c-lemon); }
      .result-row .rp-dot { width:20px; height:20px; font-size:11px; }
      .result-row .who {
        font-weight:800; font-size:clamp(12px,calc(var(--sh) * 2.1),16px); white-space:nowrap; text-align:left;
        flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;
      }
      .result-row .note { font-size:clamp(10px,calc(var(--sh) * 1.7),13px); color:#9fb8dd; white-space:nowrap; flex:none; }
      .result-row .note b { color:var(--c-lemon); }

      #hud { position:absolute; inset:0; z-index:20; pointer-events:none; }
      #look-zone { position:absolute; inset:0; pointer-events:auto; touch-action:none; }
      #topbar {
        position:absolute; top:0; left:0; right:0; display:flex; align-items:stretch; gap:8px;
        padding:calc(var(--sa-top) + 8px) calc(var(--sa-right) + 10px) 0 calc(var(--sa-left) + 10px);
      }
      .hud-box {
        background:linear-gradient(145deg,rgba(20,52,82,.9),rgba(8,24,42,.78)); border:1px solid rgba(255,255,255,.2);
        box-shadow:0 5px 16px rgba(3,12,24,.22); border-radius:11px; padding:6px 9px; display:flex; flex-direction:column;
        justify-content:center; gap:3px; flex:none;
      }
      .hud-label { font-size:10.5px; line-height:1; color:#bdd4ed; letter-spacing:.5px; white-space:nowrap; }
      .hud-value { font-size:16px; line-height:1.05; font-weight:900; color:var(--c-text); font-variant-numeric:tabular-nums; white-space:nowrap; }
      /*
       * 回合框：左边"第 N 回合 / 先赢 3 回合"，右边每人一颗小圆（名字里的一个字，玩家写"你"），
       * 圆下面一排小点是回合胜场。已淘汰的人整颗变灰。
       */
      #round-box { flex-direction:row; align-items:center; gap:9px; }
      #round-box .rb-text { display:flex; flex-direction:column; gap:3px; }
      #round-pips { display:flex; gap:4px; }
      .rp { display:flex; flex-direction:column; align-items:center; gap:2px; transition:opacity .25s, filter .25s; }
      .rp.out { opacity:.3; filter:grayscale(1); }
      .rp-dot {
        flex:none; width:18px; height:18px; border-radius:50%; background:var(--c,#6b7f99);
        display:flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,.4);
        font-style:normal; font-size:10.5px; font-weight:900; line-height:1; color:#fff;
        text-shadow:0 1px 1px rgba(0,0,0,.6);
      }
      .rp.me .rp-dot, .rp-dot.me { border-color:#fff; box-shadow:0 0 0 2px var(--c-lemon); }
      .rp-wins { display:flex; gap:1px; }
      .rp-wins i { display:block; width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.2); }
      .rp-wins i.on { background:var(--c-lemon); box-shadow:0 0 3px rgba(255,211,63,.8); }
      #phase-chip {
        background:rgba(8,24,42,.72); border:1px solid rgba(255,255,255,.18); border-radius:999px;
        padding:5px 12px; font-size:11px; font-weight:800; color:#dff1ff; letter-spacing:1px; align-self:center;
        white-space:nowrap; flex:none;
      }
      /* 车门开着 / 好挤模式：这是全车的击杀窗口，阶段牌自己要会喊。 */
      #phase-chip.alert { background:rgba(255,95,109,.92); border-color:#ffd1d4; color:#fff; animation:pulse .9s infinite; }
      @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,95,109,.5)} 50%{box-shadow:0 0 0 5px rgba(255,95,109,0)} }
      .spacer { flex: 1 1 auto; }
      #btn-pause {
        pointer-events:auto; width:34px; height:34px; border-radius:11px; border:1px solid rgba(255,255,255,.2);
        background:linear-gradient(145deg,rgba(20,52,82,.9),rgba(8,24,42,.78)); color:#fff; font-size:14px;
        display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; align-self:center;
      }
      #status-chip {
        position:absolute; left:50%; transform:translateX(-50%); top:calc(var(--sa-top) + 60px);
        background:rgba(255,211,78,.92); color:#3a2a06; font-size:11px; font-weight:900; letter-spacing:1px;
        padding:4px 12px; border-radius:999px; opacity:0; transition:opacity .18s; white-space:nowrap;
      }
      #status-chip.show { opacity: 1; }
      /*
       * 底部居中的提示分三档，行高写死，保证互不压盖：
       *   档 0（+8 ~ +30）   #grab-state 手上状态（抓着扶手 / 拖着人 / 坐着）
       *   档 1（+36 ~ +58）  #seat-guide 找座导航
       *   档 2（+66 起）     #tut-bubble 首局教学
       */
      #grab-state {
        position:absolute; left:50%; transform:translateX(-50%); bottom:calc(var(--sa-bottom) + 8px);
        background:rgba(255,211,78,.94); color:#3a2a06; font-size:11px; line-height:14px; font-weight:900; letter-spacing:.5px;
        padding:4px 12px; border-radius:999px; opacity:0; transition:opacity .15s; white-space:nowrap;
      }
      #grab-state.show { opacity: 1; }
      /* 拖着摔倒的人、车门开着：现在按"扔"就能淘汰他。 */
      #grab-state.hot { background:rgba(255,95,109,.95); color:#fff; }
      #grab-state.seat { background:rgba(8,28,44,.88); color:#CFF6E0; box-shadow:inset 0 0 0 1px rgba(107,229,154,.55); }
      #seat-guide {
        position:absolute; left:50%; transform:translateX(-50%); bottom:calc(var(--sa-bottom) + 36px);
        background:rgba(8,28,44,.86); border:1px solid rgba(107,229,154,.55); color:#CFF6E0;
        font-size:11px; line-height:14px; font-weight:800; letter-spacing:.5px;
        padding:3px 11px; border-radius:999px; opacity:0; transition:opacity .15s; white-space:nowrap;
      }
      #seat-guide.show { opacity: 1; }
      #seat-guide.ready { background:rgba(255,211,63,.95); border-color:#fff3bd; color:#3a2a06; }
      #seat-guide.full  { background:rgba(8,28,44,.86); border-color:rgba(255,255,255,.35); color:#dbe7f3; }
      /*
       * 找座箭头：目标空座在画面外时贴着屏幕边缘指过去（在画面里时绿光柱自己就看得见）。
       * 位置由 session 按舞台百分比写入 left/top，旋转写进 --rot；强制横屏旋转舞台后照样对。
       */
      #seat-arrow {
        position:absolute; width:calc(38 * var(--u, 1px)); height:calc(38 * var(--u, 1px));
        transform:translate(-50%,-50%) rotate(var(--rot, 0rad)); pointer-events:none;
        opacity:0; transition:opacity .2s;
        border-radius:50%; background:rgba(8,28,44,.72); border:2px solid rgba(107,229,154,.9);
        box-shadow:0 0 12px rgba(107,229,154,.55);
      }
      #seat-arrow::after {
        content:""; position:absolute; left:58%; top:50%; transform:translate(-50%,-50%);
        border-style:solid; border-color:transparent transparent transparent #6BE59A;
        border-width:calc(8 * var(--u, 1px)) 0 calc(8 * var(--u, 1px)) calc(13 * var(--u, 1px));
      }
      #seat-arrow.show { opacity:1; animation:seatArrowPulse .9s ease-in-out infinite; }
      @keyframes seatArrowPulse { 0%,100% { box-shadow:0 0 6px rgba(107,229,154,.4); } 50% { box-shadow:0 0 16px rgba(107,229,154,.85); } }
      /* 操作飘字 */
      #hud-toast {
        position:absolute; left:50%; top:38%; transform:translateX(-50%);
        font-size:clamp(15px,calc(var(--sh) * 3.4),26px); font-weight:900; letter-spacing:2px;
        color:#fff; text-shadow:0 2px 0 rgba(6,18,34,.55), 0 0 16px rgba(90,220,255,.7);
        opacity:0; transition:opacity .12s, transform .25s; white-space:nowrap; pointer-events:none;
      }
      #hud-toast.show { opacity:1; transform:translateX(-50%) translateY(-8px); }
      #hud-toast.fail { color:#ffb4bd; text-shadow:0 2px 0 rgba(40,6,14,.6); }

      /* 顶部留给 #status-chip（+60 ~ +82），矮屏上 19% 会压到它。 */
      #event-banner {
        position:absolute; top:max(19%, calc(var(--sa-top) + 90px)); left:50%; transform:translateX(-50%);
        background:rgba(255,95,109,.94); box-shadow:0 5px 18px rgba(62,13,26,.3); color:#fff;
        font-size:clamp(14px,calc(var(--sh) * 2.7),21px); font-weight:900;
        padding:7px 16px; border-radius:999px; opacity:0; transition:opacity .15s;
        letter-spacing:1px; white-space:nowrap;
      }
      #event-banner.show { opacity: 1; }

      #joystick-zone {
        position:absolute; left:0; bottom:0; width:46%; height:56%; pointer-events:auto; touch-action:none;
      }
      #joystick-base {
        position:absolute;
        left:max(calc(72 * var(--u)), calc(var(--sa-left) + 68 * var(--u)));
        bottom:max(calc(26 * var(--u)), calc(var(--sa-bottom) + 20 * var(--u)));
        width:clamp(calc(96 * var(--u)),calc(var(--sh) * 26),calc(132 * var(--u)));
        height:clamp(calc(96 * var(--u)),calc(var(--sh) * 26),calc(132 * var(--u)));
        border-radius:50%; background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.22),rgba(10,31,49,.32));
        border:2px solid rgba(255,255,255,.28);
        box-shadow:inset 0 0 0 calc(6 * var(--u)) rgba(255,255,255,.05),0 calc(6 * var(--u)) calc(14 * var(--u)) rgba(1,11,22,.24);
        pointer-events:none; opacity:.55; transition:opacity .12s;
      }
      #joystick-base.active { opacity: 1; }
      #joystick-knob {
        position:absolute; left:50%; top:50%; width:44%; height:44%;
        transform:translate(-50%,-50%); border-radius:50%;
        background:linear-gradient(145deg,#fff,#9ec9e6); box-shadow:0 3px 10px rgba(0,0,0,.32);
      }
      #action-zone { position:absolute; right:0; bottom:0; width:48%; height:58%; pointer-events:none; }
      .act-btn {
        position:absolute; border-radius:50%; width:var(--sz,68px); height:var(--sz,68px);
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(2 * var(--u));
        background:linear-gradient(145deg,rgba(75,150,190,.95),rgba(22,72,108,.95)); border:2px solid rgba(255,255,255,.55);
        box-shadow:0 calc(5 * var(--u)) 0 rgba(4,25,40,.38),0 calc(7 * var(--u)) calc(14 * var(--u)) rgba(2,17,28,.25);
        color:#fff; font-weight:900; letter-spacing:.4px; line-height:1;
        pointer-events:auto; touch-action:none;
        transition:transform .07s, filter .12s, opacity .2s;
      }
      .act-btn .ico { font-size:calc(19 * var(--u)); line-height:1; }
      .act-btn .lbl { font-size:calc(13 * var(--u)); line-height:1; letter-spacing:0; white-space:nowrap; }
      #btn-push .ico { font-size:calc(22 * var(--u)); }
      #btn-push .lbl { font-size:calc(16 * var(--u)); }
      /* 首局引导。刻意不做全屏遮罩：摇杆是左半屏动态起按，
         任何盖在上面的遮罩都会吃掉 pointerdown，玩家会"照着教程做却动不了"。 */
      #tut-bubble {
        position:absolute; left:50%; transform:translateX(-50%);
        bottom:calc(var(--sa-bottom) + 66px); max-width:78%;
        background:rgba(8,24,42,.92); border:1px solid rgba(255,211,78,.5);
        color:#fff; font-size:clamp(11px,calc(var(--sh) * 2.2),15px); line-height:1.3; font-weight:700;
        padding:7px 14px; border-radius:999px; white-space:nowrap;
        opacity:0; transition:opacity .2s; pointer-events:none;
      }
      #tut-bubble.show { opacity:1; }
      #tut-skip {
        position:absolute; right:calc(var(--sa-right) + 10px); top:calc(var(--sa-top) + 60px);
        pointer-events:auto; cursor:pointer;
        background:rgba(8,24,42,.7); border:1px solid rgba(255,255,255,.2);
        color:#bdd4ed; font-size:11px; padding:4px 10px; border-radius:999px;
      }
      .tut-pulse { animation:tutPulse 1s ease-in-out infinite; }
      @keyframes tutPulse {
        0%,100% { box-shadow:0 0 0 0 rgba(255,211,78,.7); }
        50% { box-shadow:0 0 0 10px rgba(255,211,78,0); }
      }
      .act-btn.primary { background:linear-gradient(145deg,#ff8b83,#ef405c); border-color:#ffd1d4; }
      .act-btn.active { transform:scale(.9); filter:brightness(1.35); }
      /* 冷却：整体压暗 + 角标读秒，不拿遮罩盖住按钮上的字。 */
      .act-btn.cooling { filter:grayscale(.75) brightness(.62); }
      .act-btn .cd {
        position:absolute; top:calc(-3 * var(--u)); right:calc(-3 * var(--u));
        min-width:calc(19 * var(--u)); height:calc(19 * var(--u)); padding:0 calc(4 * var(--u)); border-radius:999px;
        display:none; align-items:center; justify-content:center;
        background:#0b1220; color:#ffd23f; font-size:calc(11 * var(--u)); font-weight:900; border:1px solid rgba(255,211,78,.5);
        font-variant-numeric:tabular-nums;
      }
      .act-btn.cooling .cd { display:flex; }
      /* 坐着不能推、不能冲：两个键直接压暗，别让玩家以为按了没反应是卡了。 */
      .act-btn.off { filter:grayscale(.85) brightness(.5); }
      /* 硬直（被推中、刚坐下/起身）：按键只缓冲 0.15 秒，按钮要看得出"现在按不动"。 */
      #hud.stunned .act-btn { filter:grayscale(.45) brightness(.72); }
      /* 已被淘汰：本回合剩下的时间只能看，操作件淡掉。 */
      #hud.out .act-btn, #hud.out #joystick-base { opacity:.28; }
      /*
       * 三个动作键（docs/08 第 3.1 节）。尺寸和偏移都乘 --u（手机上 =1px），--spread 只在放大时非 0。
       *   推 / 扔：右下角，最大，主攻键（连推把人推倒、抓着摔倒的人时变成"扔"）；
       *   抓：推的左边，次大 —— 触屏上点一下锁住、再点一下松手（键盘是按住 E），放在拇指最顺手的横向位置；
       *   冲：推的正上方，小一号。
       * 844×390：推 74px、抓 66px、冲 51px，相邻两颗的间隙 ≥10px；667×375 上 ≥13px。
       */
      #btn-push {
        right:max(calc(18 * var(--u)), calc(var(--sa-right) + 14 * var(--u)));
        bottom:max(calc(22 * var(--u)), calc(var(--sa-bottom) + 18 * var(--u)));
        --sz:clamp(calc(62 * var(--u)),calc(var(--sh) * 19),calc(84 * var(--u)));
      }
      #btn-grab {
        right:calc(max(calc(104 * var(--u)), calc(var(--sa-right) + 100 * var(--u))) + var(--spread));
        bottom:max(calc(26 * var(--u)), calc(var(--sa-bottom) + 22 * var(--u)));
        --sz:clamp(calc(56 * var(--u)),calc(var(--sh) * 17),calc(74 * var(--u)));
      }
      #btn-dash {
        right:max(calc(39 * var(--u)), calc(var(--sa-right) + 35 * var(--u)));
        bottom:calc(max(calc(106 * var(--u)), calc(var(--sa-bottom) + 102 * var(--u))) + var(--spread));
        --sz:clamp(calc(46 * var(--u)),calc(var(--sh) * 13),calc(58 * var(--u)));
      }
      #btn-dash .ico { font-size:calc(16 * var(--u)); }
      #btn-dash .lbl { font-size:calc(12 * var(--u)); }
      /* 抓着东西（扶手或人）：按钮变柠檬黄，松手就放开。 */
      #btn-grab.on { background:linear-gradient(145deg,#ffe886,#ffbe37); color:#0b1220; border-color:#fff3bd; }
      /* 够得着空座：按钮换绿色 + 脉冲，这一下是"坐下"。 */
      #btn-grab.sit {
        background:linear-gradient(145deg,#9CF5C4,#3FD08B); color:#06301D; border-color:#DBFFEC;
        animation:seatReady .7s ease-in-out infinite;
      }
      @keyframes seatReady {
        0%,100% { box-shadow:0 0 0 0 rgba(107,229,154,.65); }
        50%     { box-shadow:0 0 0 9px rgba(107,229,154,0); }
      }
      /*
       * 抓着摔倒的人：推键变成"扔"。用橙色而不是柠檬黄 —— 这时"抓"键也是黄的（抓着），
       * 两颗一样黄就看不出哪颗是现在该按的。车门开着时再加脉冲：现在扔出门就淘汰他。
       */
      #btn-push.throw { background:linear-gradient(145deg,#ffc15e,#ff7b1c); color:#3a1600; border-color:#fff0c2; }
      #btn-push.throw.hot { animation:throwReady .6s ease-in-out infinite; }
      @keyframes throwReady {
        0%,100% { box-shadow:0 0 0 0 rgba(255,211,63,.8); }
        50%     { box-shadow:0 0 0 12px rgba(255,211,63,0); }
      }

      /*
       * 回合间歇（约 3 秒，session 控制显示时长）：本回合谁赢了 + 当前胜场表。
       * 不拦触摸（pointer-events:none），也没有按钮；z 在 HUD 之上、大厅/结算之下。
       */
      #intermission {
        position:absolute; inset:0; z-index:26; display:flex; align-items:center; justify-content:center;
        padding:calc(var(--sa-top) + 10px) calc(var(--sa-right) + 16px) calc(var(--sa-bottom) + 10px) calc(var(--sa-left) + 16px);
        background:radial-gradient(ellipse at 50% 45%,rgba(6,16,30,.5),rgba(6,16,30,.82));
        pointer-events:none; opacity:0; visibility:hidden; transition:opacity .25s, visibility 0s linear .25s;
      }
      #intermission.show { opacity:1; visibility:visible; transition:opacity .25s; }
      /* 间歇期间收起 HUD 上的瞬态提示，免得上一回合的横幅从卡片边上露出来。 */
      #hud.inter #event-banner, #hud.inter #hud-toast, #hud.inter #status-chip, #hud.inter #tut-bubble,
      #hud.inter #grab-state, #hud.inter #seat-guide, #hud.inter #seat-arrow, #hud.inter #tut-skip { visibility:hidden; }
      .im-card {
        width:min(620px,100%); max-height:100%; overflow:hidden;
        display:flex; flex-direction:column; align-items:center; gap:clamp(6px,calc(var(--sh) * 2),12px);
        padding:clamp(10px,calc(var(--sh) * 3),20px) clamp(12px,calc(var(--sw) * 2.4),24px);
        border-radius:18px; color:var(--c-text); text-align:center;
        background:linear-gradient(145deg,rgba(17,53,77,.94),rgba(8,25,46,.92)); border:1px solid rgba(185,238,247,.3);
        box-shadow:0 18px 48px rgba(2,10,24,.45), inset 0 1px rgba(255,255,255,.12);
        transform:scale(.92); transition:transform .35s cubic-bezier(.2,1.5,.4,1);
      }
      #intermission.show .im-card { transform:scale(1); }
      .im-round { font-size:clamp(11px,calc(var(--sh) * 2),14px); font-weight:800; letter-spacing:3px; color:#a8c3e8; }
      .im-head { font-size:clamp(20px,calc(var(--sh) * 5.4),38px); font-weight:900; letter-spacing:1px; line-height:1.15; }
      .im-head .me { color:var(--c-lemon); }
      .im-winners { display:flex; flex-wrap:wrap; justify-content:center; gap:5px 12px; }
      .im-winners:empty { display:none; }
      .im-w { display:flex; align-items:center; gap:5px; font-size:clamp(11px,calc(var(--sh) * 2),14px); font-weight:800; white-space:nowrap; }
      .im-table { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; width:100%; }
      .im-cell {
        position:relative; display:flex; align-items:center; gap:6px; min-width:0;
        padding:5px 7px; border-radius:10px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
      }
      .im-cell.me { border-color:var(--c-lemon); background:rgba(255,211,78,.14); }
      .im-cell .rp-dot { width:22px; height:22px; font-size:12px; }
      .im-info { display:flex; flex-direction:column; align-items:flex-start; gap:4px; min-width:0; }
      .im-name { font-size:clamp(10.5px,calc(var(--sh) * 1.8),13px); font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
      .im-cell .rp-wins { gap:2px; }
      .im-cell .rp-wins i { width:7px; height:7px; }
      /* 这一回合刚拿到的那一分：弹一下。 */
      .rp-wins i.new { animation:pipPop .55s .3s both; }
      @keyframes pipPop { 0% { transform:scale(0); } 60% { transform:scale(1.9); } 100% { transform:scale(1); } }
      .im-tag {
        position:absolute; top:-7px; right:-3px; font-size:10px; line-height:1; font-weight:900;
        padding:2px 5px; border-radius:999px; background:var(--c-coral); color:#fff; letter-spacing:.5px;
      }
      .im-foot { font-size:clamp(10.5px,calc(var(--sh) * 1.6),12px); color:#7e9cc4; letter-spacing:.5px; }

      /* 暂停 */
      #pause-mask {
        position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px;
        background:rgba(6,16,30,.78); color:#fff;
      }
      #pause-mask.show { display:flex; }

      /* 加载 */
      #loading {
        position:absolute; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
        background:linear-gradient(145deg,#10334e,#0c1930); color:#dff1ff; font-size:14px; letter-spacing:2px;
      }
      #loading.hidden { display: none; }
      #loading .bar { width:min(220px,50vw); height:6px; border-radius:6px; background:rgba(255,255,255,.14); overflow:hidden; }
      /* 加载页只在 JS 下载期间出现，拿不到进度，用来回滑动的条表示"在动"。模型的进度显示在大厅的开始按钮上。 */
      #loading .bar i { display:block; height:100%; width:35%; border-radius:6px; background:linear-gradient(90deg,#22c1a6,#ffd23f); animation:loadSlide 1.1s ease-in-out infinite alternate; }
      @keyframes loadSlide { from { transform:translateX(-10%); } to { transform:translateX(195%); } }
      .btn:disabled { opacity:.7; cursor:default; filter:saturate(.6); }
      .btn:disabled:active { transform:none; }

      /* 音效开关。大厅：右上角图标（标题居中、选角面板在标题下方，角落是空的）；
         暂停页：一颗带文字的按钮，和"继续/退出"区分开，看得出是设置而不是动作。 */
      .sound-corner {
        position:absolute; top:calc(var(--sa-top) + 10px); right:calc(var(--sa-right) + 12px); z-index:1;
        width:34px; height:34px; padding:0; border-radius:11px; border:1px solid rgba(255,255,255,.2);
        background:linear-gradient(145deg,rgba(20,52,82,.9),rgba(8,24,42,.78)); color:#fff;
        font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer;
      }
      .sound-corner[aria-pressed="false"] { opacity:.7; }
      .btn.toggle { background:rgba(255,255,255,.1); color:#dff1ff; border:1px solid rgba(255,255,255,.28); }

      .dim { color: #9fb8dd; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="safe-area-probe"></div>

    <div id="stage">
      <div id="app"></div>

      <!-- 大厅 -->
      <div id="lobby" class="screen">
        <button id="btn-sound-lobby" class="sound-corner" data-sound-toggle="icon" aria-pressed="true">🔊</button>
        <div>
          <h1>好挤的<span class="accent">大巴</span></h1>
          <p class="sub">推倒 · 拖走 · 扔下车 · 最后留在车上的赢</p>
        </div>
        <div class="panel">
          <div id="roster" class="roster"></div>
          <p class="roster-note">8 个角色能力<b>完全一样</b>，挑个顺眼的 · 先赢 3 回合拿下整场</p>
        </div>
        <!--
          环顾是个藏起来的手势，不说就等于没有。
          放在大厅而不是塞进对局教学：第一回合的气泡已经够多了，
          再加一条会把"车门开着"这种真正致命的信息挤没。
        -->
        <p class="hint">左手摇杆走位 · 右手 抓 / 推 / 冲 · 空白处左右滑动可环顾四周</p>
        <button id="btn-start" class="btn">开始上车</button>
      </div>

      <!-- 整场结算 -->
      <div id="result" class="screen hidden">
        <div>
          <h1 id="result-title">🏆 <span class="accent">结算</span></h1>
          <p class="sub" id="result-sub"></p>
        </div>
        <div id="result-records"></div>
        <div class="panel" id="result-list"></div>
        <div class="result-actions">
          <button id="btn-share" class="btn secondary">生成战绩图</button>
          <button id="btn-lobby" class="btn secondary">换角色</button>
          <button id="btn-again" class="btn">再挤一局</button>
        </div>
      </div>

      <!-- 对局 HUD -->
      <div id="hud" class="hidden">
        <!--
          环顾层：必须是 #hud 的第一个子元素。
          命中测试取的是该点最上层的元素，同层级下后来的兄弟在上 ——
          于是摇杆区、动作按钮、暂停键天然优先，落在它们之外的拖动才会到这里。
          不需要任何手动的区域排除。
        -->
        <div id="look-zone"></div>
        <div id="topbar">
          <div class="hud-box" id="round-box">
            <div class="rb-text">
              <span class="hud-value" id="hud-round">第 1 回合</span>
              <span class="hud-label" id="hud-goal">先赢 3 回合</span>
            </div>
            <div id="round-pips"></div>
          </div>
          <div id="phase-chip">上车中</div>
          <div class="spacer"></div>
          <div class="hud-box">
            <span class="hud-label" id="hud-time-label">发车</span>
            <span class="hud-value" id="hud-time">0:00</span>
          </div>
          <div class="hud-box">
            <span class="hud-label">车上</span>
            <span class="hud-value" id="hud-alive">8人</span>
          </div>
          <div id="btn-pause">⏸</div>
        </div>
        <div id="status-chip"></div>
        <div id="grab-state"></div>
        <div id="seat-guide"></div>
        <div id="seat-arrow"></div>
        <div id="tut-bubble"></div>
        <div id="tut-skip" class="hidden">跳过教学</div>
        <div id="hud-toast"></div>
        <div id="event-banner"></div>
        <div id="joystick-zone">
          <div id="joystick-base"><div id="joystick-knob"></div></div>
        </div>
        <div id="action-zone">
          <div class="act-btn" id="btn-grab"><span class="ico" id="grab-ico">✋</span><span class="lbl" id="grab-name">抓</span></div>
          <div class="act-btn" id="btn-dash"><span class="ico">⚡</span><span class="lbl">冲</span></div>
          <div class="act-btn primary" id="btn-push"><span class="ico" id="push-ico">💥</span><span class="lbl" id="push-name">推</span></div>
        </div>
      </div>

      <!-- 回合间歇：本回合谁赢了 + 胜场表（screens.ts 的 showIntermission / hideIntermission） -->
      <div id="intermission" aria-live="polite">
        <div class="im-card">
          <div class="im-round" id="im-round">第 1 回合</div>
          <div class="im-head" id="im-head"></div>
          <div class="im-winners" id="im-winners"></div>
          <div class="im-table" id="im-table"></div>
          <div class="im-foot" id="im-foot">先赢 3 回合拿下整场</div>
        </div>
      </div>

      <div id="loading">
        <div>好挤的大巴</div>
        <div class="bar"><i></i></div>
        <div class="dim" style="font-size:11px">正在把乘客塞上车…</div>
      </div>

      <div id="pause-mask">
        <h1>已暂停</h1>
        <button id="btn-resume" class="btn">继续</button>
        <button id="btn-sound-pause" class="btn toggle" data-sound-toggle="label" aria-pressed="true">🔊 音效：开</button>
        <button id="btn-quit" class="btn" style="background:linear-gradient(180deg,#8fa6c4,#6b83a3)">退出本局</button>
      </div>
    </div>
    <!-- /#stage -->

    <!-- 战绩图浮层。刻意放在 #stage 外面：强制横屏时 stage 被 rotate(90deg)，
         而 transform 祖先会让 position:fixed 跟着一起转 —— 放在里面看到的是转了 90° 的图；
         放外面不跟舞台旋转，正好是竖屏观感（玩家本来就要把手机转回竖屏去发微信）。 -->
    <div id="share-overlay">
      <img id="share-img" alt="战绩图" />
      <div class="side">
        <div class="share-tip">长按图片保存<br>发送给朋友</div>
        <button id="share-close" class="btn">关闭</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
